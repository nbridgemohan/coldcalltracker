name: CI

# Vercel deploys every push (production on main, previews on PRs).
# This workflow gates quality: lint, typecheck and a production build.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # Build doesn't touch the DB; these just satisfy config.
          AUTH_SECRET: ci-placeholder
          APP_PASSWORD: ci-placeholder
